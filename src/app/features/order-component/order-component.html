<div class="order-component">
    <div class="order-right">
        <app-navbar-component></app-navbar-component>
    </div>


    <div class="order-left">
        <div class="table-container">
            <p>Nombre de commandes : {{ orders().length }}</p>
            <table>
                <thead>
                    <tr>
                        <th>Nom</th>
                        <th>Description</th>
                        <th>Statut</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody>

                    @for(o of orders(); track o.id) {
                    <tr>
                        <td>{{ o.nomClient }}</td>
                        <td>{{ o.description }}</td>
                        <td>{{ o.statut }}</td>
                        <td class="td-actions">
                            <app-button-component color="#E16A54" icon="/update.png"
                                (click)="openUpdateForm(o)"></app-button-component>
                            <app-button-component color="#E16A54" icon="/delete.png"></app-button-component>
                        </td>
                    </tr>

                    }
                </tbody>
            </table>
        </div>
        @if(selectedOrder(); as order) {
        <div class="modal-overlay">
            <div class="modal-content">
                <app-form-update-order-component
                    [order]="order"
                ></app-form-update-order-component>
            </div>
        </div>
        }
    </div>

</div>
